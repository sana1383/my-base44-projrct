# Base44 dev environment for Horizon Properties (Vite + React SPA).
# Runs the app straight from the cloned source so edits are reflected live.

services:
  web:
    image: node:22
    working_dir: /app
    # Dependencies are installed from the lockfile on start (node_modules lives
    # in a named volume), then the Vite dev server takes over with HMR.
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - web_npm_cache:/root/.npm
    environment:
      # Platform-provided values, passed through unchanged.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      # Bind mounts do not emit native file events reliably here.
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      # Probes real HTTP responsiveness of the dev server.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure

volumes:
  web_node_modules:
  web_npm_cache:
